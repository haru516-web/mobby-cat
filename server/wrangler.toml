name = "nyakomobby-server"
main = "src/index.ts"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

# Hourly clean-up of rate-limit counters (so an address is not kept past its window).
[triggers]
crons = ["23 * * * *"]

# Created with `npx wrangler d1 create nyakomobby` (2026-10-28). The id is not a secret; never commit account credentials.
[[d1_databases]]
binding = "DB"
database_name = "nyakomobby"
database_id = "527c0d28-1d3a-48e2-9d26-109e79773bc3"

[vars]
APPLE_BUNDLE_ID = "com.mobbycat.app"
# Sandbox is accepted so TestFlight and App Review purchases work. Keep it after the release too: App Review buys in the
# Sandbox for every later update. Only the developer's testers, TestFlight and App Review can make Sandbox purchases;
# they are stored with environment = Sandbox, so leave them out of sales figures.
PURCHASE_ENVIRONMENTS = "Production,Sandbox"
# Product ids are provisional; ids and prices must match App Store Connect before release.
# A product is either a one-time purchase (tickets or matatabi) or a plan; never both.
PRODUCT_CATALOG_JSON = '''{"com.mobbycat.app.ticket.1":{"tickets":1,"priceYen":200},"com.mobbycat.app.ticket.6":{"tickets":6,"priceYen":1000},"com.mobbycat.app.matatabi.5":{"matatabi":5,"priceYen":300},"com.mobbycat.app.matatabipass.monthly":{"plan":"matatabi_pass","monthlyTickets":8,"priceYen":1500}}'''
